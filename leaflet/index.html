<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Crash Course</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
    body{
        margin: 0;
        padding: 0;
    }
    #map {
        width: 100%;
        height: 100vh;
    }
    .coordinate{
        position: absolute;
        bottom: 10px;
        right: 50%;
    }
</style>
</head>
<body>
    <div id="map">
        <div class="leaflet-control coordinate"></div>
    </div>
</body>
</html>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="./js/line.js"></script>
<script src="./js/polygon.js"></script>
<script src="./js/point.js"></script>


<script>
                                // Tile Layer and WMS
    // Map Intialization
    var map = L.map('map').setView([24.8607, 67.0011], 12);

    // OSM Layer
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });
    osm.addTo(map);

    // Tile layers from (https://leaflet-extras.github.io/leaflet-providers/preview/)
    var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
	attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });
   
    var OpenRailwayMap = L.tileLayer('https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png', {
	maxZoom: 19,
	attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Map style: &copy; <a href="https://www.OpenRailwayMap.org">OpenRailwayMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
    });
    Esri_WorldImagery.addTo(map);
    OpenRailwayMap.addTo(map);

    // Google Street Maps
    // Note that difference in the "lyrs" parameter in the URL:

    // Hybrid: s,h;
    // Satellite: s;
    // Streets: m;
    // Terrain: p;

    googleStreets = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{
    maxZoom: 20,
    subdomains:['mt0','mt1','mt2','mt3']
    });
    googleStreets.addTo(map);

    //For Raster Files
    var nexrad = L.tileLayer.wms("http://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi", {
    layers: 'nexrad-n0r-900913',
    format: 'image/png',
    transparent: true,
    attribution: "Weather data © 2012 IEM Nexrad"
    });

    // Adding marker with popup
    var myIcon = L.icon({
    iconUrl: 'img/red_marker.png',
    iconSize: [40, 40],
    });

    var single_marker = L.marker([24.8607, 67.0011], {icon: myIcon, draggable: true}).addTo(map)
    var popup = single_marker.bindPopup('Karachi.<br> The City of Lights.').openPopup();
    popup.addTo(map);

    // GeoJSON
    var point = L.geoJSON(pointJson).addTo(map);
    var line = L.geoJSON(lineJson).addTo(map);
    var polygon = L.geoJSON(polygonJson, {
            onEachFeature: function(feature, layer){
                layer.bindPopup('<b>Name: </b>' + feature.properties.Name)
            },
            style:{
               // fillColor: 'blue',
                fillOpacity: 1,
                //color: '#c0c0c0',
            }
    }).addTo(map);

    //Layer Controller
    var baseMaps = {
    "Open Street Map": osm,
    "ESRI Worl Imagery": Esri_WorldImagery,
    "Railway Map": OpenRailwayMap,
    "Google Streets Map": googleStreets,
    };

    var overlayMaps = {
        "Marker": single_marker,
        "Polygon": polygon,
        "Line": line,
        "Point": point,
        "NexRad": nexrad,
    };

    var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);  
    
    // Leaflet Events
    map.on('mousemove', function(e){
        document.getElementsByClassName('coordinate')[0].innerHTML = "Lat: " + e.latlng.lat + "Lng: " + e.latlng.lng;
    })

    // Style Customization
    
</script>
