<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Routing Machine</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
    body{
        margin: 0;
        padding: 0;
    }
    #map {
        width: 100%;
        height: 700px;
    }
</style>
</head>
<body>
    <div id="map">
        
    </div>

    <button onclick=fullscreenview()>View on Full Screen</button>

</body>
</html>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    // Map Intialization
    var map = L.map('map').setView([24.8607, 67.0011], 11);
    map.zoomControl.setPosition('topright');

    // OSM Layer
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });
    osm.addTo(map);

    // Adding marker with popup
    var myIcon = L.icon({
    iconUrl: 'img/red_marker.png',
    iconSize: [40, 40],
    });

    var single_marker = L.marker([24.8607, 67.0011], {icon: myIcon, draggable: true}).addTo(map)
    var popup = single_marker.bindPopup('Karachi.<br> The City of Lights.').openPopup();
    popup.addTo(map);

    // Map Scale
    L.control.scale({position: "bottomright"}).addTo(map);

    // Full Screen Map View
    var mapId = document.getElementById('map');
    function fullscreenview(){
        mapId.requestFullscreen();
    }
    
</script>
