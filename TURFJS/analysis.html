<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Spatial Analysis</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
    body{
        margin: 0;
        padding: 0;
    }
    #map {
        width: 100%;
        height: 100vh;
    }
</style>
</head>
<body>
    <div id="map">
        
    </div>
</body>
</html>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Turf JS -->
 <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<!-- Karachi District -->
<script src="./data/karachi_district.js"></script>
<script src="./data/karachi_district_hq.js"></script>

<script>
    // Map Intialization
    var map = L.map('map').setView([24.8607, 67.0011], 11);
    map.zoomControl.setPosition('topright');

    // OSM Layer
    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });
    osm.addTo(map);

    // Adding marker with popup
    var myIcon = L.icon({
    iconUrl: '../leaflet/img/red_marker.png',
    iconSize: [40, 40],
    });

    var single_marker = L.marker([24.8607, 67.0011], {icon: myIcon, draggable: true}).addTo(map)
    var popup = single_marker.bindPopup('Karachi.<br> The City of Lights.').openPopup();
    popup.addTo(map);

    var karachi_district = L.geoJSON(karachi_district_geojson, {
        onEachFeature: function(feature, layer){
            area = (turf.area(feature)/1000000).toFixed(2);
            center_lat = turf.center(feature).geometry.coordinates[1]
            center_long = turf.center(feature).geometry.coordinates[0]
            bbox = turf.bbox(feature).toString();

            layer.bindPopup('<b>Area: </b>' + area + ' km²<br>' + 'Center(x, y): ' + (center_lat,center_long) + '<br> Bbox: [' + bbox + ']')
        }
    });
    var district_hq = L.geoJSON(karachi_district_hq_geojson);

    karachi_district.addTo(map);
    district_hq.addTo(map);

    base_layer = {
        'OSM' :osm
    }

    other_layers = {
        'Karachi District': karachi_district,
        'District Headquarters': district_hq
    }

    L.control.layers(base_layer, other_layers).addTo(map);

    // Turf Creating geometry (GeoJSON) Below Code is not working will fix later In Sha ALLAH

    // Point
    var point = turf.multiPoint([[67.0011, 24.8607], [67.0011, 24.8607]]);
    // L.geoJSON(point).addTo(map);

    // LineStrings
    var linestring1 = turf.lineString([[-24, 63], [-23, 60], [-25, 65], [-20, 69]], { name: 'line 1' });
    var linestring2 = turf.lineString([[-14, 43], [-13, 40], [-15, 45], [-10, 49]], { name: 'line 2' });
    // L.geoJSON(linestring1).addTo(map);

    // Polygon
    var polygon1 = turf.polygon([[[-5, 52], [-4, 56], [-2, 51], [-7, 54], [-5, 52]]], { name: 'poly1' });
    // L.geoJSON(polygon1).addTo(map);

    // Random Points
    var points = turf.randomPoint(10, { bbox: [80, 20, 90, 30] });
    var pointsGeojson = L.geoJSON(points).addTo(map);

    // Random Polygons
    var polygonRandom = turf.randomPolygon(2, { bbox: [80, 20, 90, 30] });
    L.geoJSON(polygonRandom).addTo(map);

    // Fit map to points
    map.fitBounds(pointsGeojson.getBounds());

</script>
